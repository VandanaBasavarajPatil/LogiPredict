<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#f4f4f4;
        }

        .login-container{
            width:380px;
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
        }

        .logo{
            text-align:center;
            margin-bottom:10px;
            font-size:28px;
            font-weight:bold;
            color:#4f46e5;
        }

        h1{
            text-align:center;
            margin-bottom:10px;
            font-size:38px;
        }

        .subtitle{
            text-align:center;
            color:gray;
            margin-bottom:25px;
        }

        .social-icons{
            display:flex;
            justify-content:center;
            gap:20px;
            margin-bottom:25px;
        }

        .social-icons div{
            width:55px;
            height:55px;
            border:1px solid #ddd;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:24px;
            cursor:pointer;
        }

        .divider{
            text-align:center;
            color:gray;
            margin:20px 0;
            position:relative;
        }

        .divider::before,
        .divider::after{
            content:"";
            position:absolute;
            width:40%;
            height:1px;
            background:#ddd;
            top:50%;
        }

        .divider::before{
            left:0;
        }

        .divider::after{
            right:0;
        }

        .input-group{
            margin-bottom:18px;
        }

        .input-group label{
            display:block;
            margin-bottom:8px;
            font-size:14px;
        }

        .input-group input{
            width:100%;
            padding:14px;
            border:1px solid #ddd;
            border-radius:10px;
            outline:none;
        }

        .extra-options{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
            font-size:14px;
        }

        .extra-options a{
            text-decoration:none;
            color:#111;
        }

        .login-btn{
            width:100%;
            padding:14px;
            background:black;
            color:white;
            border:none;
            border-radius:10px;
            font-size:16px;
            cursor:pointer;
        }

        .register-link{
            text-align:center;
            margin-top:20px;
            font-size:14px;
        }

        .register-link a{
            text-decoration:none;
            font-weight:bold;
            color:black;
        }

        .error{
            color:red;
            text-align:center;
            margin-bottom:15px;
        }

    </style>

</head>

<body>

    <div class="login-container">

      

        <h1>Welcome back</h1>

        <p class="subtitle">
            Please enter your details to sign in
        </p>


      

        {% if error %}
            <p class="error">
                {{ error }}
            </p>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="input-group">

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter Username"
                    required
                >

            </div>

            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter Password"
                    required
                >

            </div>

            <div class="extra-options">

                <div>
                    <input type="checkbox">
                    Remember me
                </div>

                <a href="#">
                    Forgot password?
                </a>

            </div>

            <button type="submit" class="login-btn">
                Sign in
            </button>

        </form>

        <div class="register-link">

            Don't have an account?

            <a href="{% url 'register' %}">
                Sign up
            </a>

        </div>

    </div>

</body>

</html>
